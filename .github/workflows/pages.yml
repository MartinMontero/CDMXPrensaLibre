name: Deploy to GitHub Pages

# Deploys the static site to GitHub Pages after validation passes.
# Requires: repo Settings → Pages → "Build and deployment" → Source = "GitHub Actions".
# NOTE: GitHub Pages cannot set custom HTTP headers, so the security headers in
# `_headers` / `netlify.toml` will NOT apply there — only the <meta> CSP fallback.
# For the full header set, deploy on Cloudflare Pages or Netlify instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/validate.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
